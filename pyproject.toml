[project]
name = "m5-forecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "mlflow==3.16.0",
    "pydantic-settings==2.15.0",
    "pandera==0.33.1",
    "pandas==3.0.5",
    "numpy==2.5.3",
    "statsforecast==2.0.1",
    "mlforecast==1.0.2",
    "lightgbm==4.7.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
